<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>עיצובימייל - קטלוג תבניות ו-GIFs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Frank+Ruhl+Libre:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <span class="badge">ענן תבניות ו-GIFs מתעדכן</span>
        <h1>✉️ עיצובימייל - גלריית תבניות, אמוג'י 3D ו-GIFs</h1>
        <p>צפה במגוון ענק של תבניות מעוצבות, אנימציות, אייקונים מונפשים ואמוג'י 3D למייל. העתק בלחיצת כפתור אחת ישירות לג'ימייל!</p>
    </header>

    <div class="container">
        <!-- Controls: Search & Category Filter Tabs -->
        <div class="controls-wrapper">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="חפש תבנית, GIF, אמוג'י, נושא או מילת מפתח..." oninput="filterTemplates()">
            </div>
            <div class="tabs-container" id="tabsContainer">
                <button class="tab-btn active" onclick="selectCategory('all', this)">🌟 הכל</button>
            </div>
        </div>

        <!-- Catalog Container -->
        <div id="catalogContainer">
            <div style="text-align: center; padding: 40px; color: #64748b;">
                טוען את קטלוג התבניות...
            </div>
        </div>
    </div>

    <div id="toast" class="toast">✨ הועתק ללוח בהצלחה! פתח את ג'ימייל והדבק (Ctrl+V)</div>

    <script>
        let catalogData = null;
        let currentFilter = 'all';
        window.templateStore = {};

        async function loadCatalog() {
            try {
                const res = await fetch('templates.json');
                catalogData = await res.json();
                buildTabs(catalogData.categories || {});
                renderCatalog();
            } catch (err) {
                console.error("Error loading templates.json:", err);
                document.getElementById('catalogContainer').innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #ef4444;">
                        שגיאה בטעינת קובץ templates.json. ודא שהקובץ קיים באותה תיקייה.
                    </div>
                `;
            }
        }

        function buildTabs(categories) {
            const tabsContainer = document.getElementById('tabsContainer');
            for (const [key, cat] of Object.entries(categories)) {
                const btn = document.createElement('button');
                btn.className = 'tab-btn';
                btn.textContent = cat.label;
                btn.onclick = () => selectCategory(key, btn);
                tabsContainer.appendChild(btn);
            }
        }

        function selectCategory(catKey, btnEl) {
            currentFilter = catKey;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btnEl.classList.add('active');
            renderCatalog();
        }

        function filterTemplates() {
            renderCatalog();
        }

        function renderCatalog() {
            if (!catalogData || !catalogData.categories) return;

            const container = document.getElementById('catalogContainer');
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            container.innerHTML = '';

            let totalMatches = 0;

            for (const [catKey, cat] of Object.entries(catalogData.categories)) {
                if (currentFilter !== 'all' && currentFilter !== catKey) continue;

                // Filter items by search query
                const items = (cat.items || []).filter(item => {
                    if (!query) return true;
                    const name = (item.name || '').toLowerCase();
                    const desc = (item.description || '').toLowerCase();
                    const catLabel = (cat.label || '').toLowerCase();
                    return name.includes(query) || desc.includes(query) || catLabel.includes(query);
                });

                if (items.length === 0) continue;
                totalMatches += items.length;

                const section = document.createElement('div');
                section.className = 'category-section';

                const catTitle = document.createElement('h2');
                catTitle.className = 'category-title';
                catTitle.textContent = cat.label;
                section.appendChild(catTitle);

                const grid = document.createElement('div');
                grid.className = 'grid';

                items.forEach(item => {
                    window.templateStore[item.id] = item.content;

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-preview">
                            <div class="preview-scaler">${item.content}</div>
                        </div>
                        <div class="card-info">
                            <h3>${item.name}</h3>
                            <p>${item.description || ''}</p>
                            <div class="card-actions">
                                <button class="btn btn-primary" onclick="copyTemplateHtml('${item.id}')">📋 העתק למייל</button>
                                <button class="btn btn-secondary" onclick="viewSource('${item.id}')">&lt;/&gt; קוד HTML</button>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                section.appendChild(grid);
                container.appendChild(section);
            }

            if (totalMatches === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 50px 20px; color: #64748b;">
                        <div style="font-size: 40px; margin-bottom: 10px;">🔍</div>
                        <h3 style="font-size: 20px; color: #334155; margin-bottom: 6px;">לא נמצאו תבניות מתאימות</h3>
                        <p>נסה לחפש במילים אחרות או בחר קטגוריה אחרת.</p>
                    </div>
                `;
            }
        }

        async function copyTemplateHtml(id) {
            const html = window.templateStore[id];
            if (!html) return;

            try {
                // Rich HTML Clipboard Copy
                const blobHtml = new Blob([html], { type: 'text/html' });
                const blobText = new Blob([html.replace(/<[^>]*>/g, '')], { type: 'text/plain' });
                const item = new ClipboardItem({
                    'text/html': blobHtml,
                    'text/plain': blobText
                });
                await navigator.clipboard.write([item]);
                showToast();
            } catch (err) {
                // Fallback for browsers
                const tempEl = document.createElement('div');
                tempEl.innerHTML = html;
                tempEl.style.position = 'fixed';
                tempEl.style.left = '-9999px';
                document.body.appendChild(tempEl);
                
                const range = document.createRange();
                range.selectNodeContents(tempEl);
                const selection = window.getSelection();
                selection.removeAllRanges();
                selection.addRange(range);
                document.execCommand('copy');
                document.body.removeChild(tempEl);
                showToast();
            }
        }

        function viewSource(id) {
            const html = window.templateStore[id];
            if (!html) return;
            prompt("העתק את קוד ה-HTML:", html);
        }

        function showToast() {
            const t = document.getElementById('toast');
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3500);
        }

        loadCatalog();
    </script>
</body>
</html>
